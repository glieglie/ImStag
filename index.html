<!DOCTYPE html>
<html>
<head>
    <title>The Stag Escape</title>

    <style>
        body {
            margin: 0;
            background: #dce8d5;
            color: #182018;
            font-family: Arial, sans-serif;
            text-align: center;
            transition: 2s;
        }

        .classroom {
            max-width: 850px;
            margin: auto;
            padding: 35px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 5px;
        }

        .stag {
            font-size: 120px;
            margin: 20px;
            transition: 2s;
        }

        .blackboard {
            background: #24452c;
            color: white;
            border: 8px solid #70452b;
            padding: 25px;
            margin: 30px auto;
            max-width: 650px;
            box-shadow: 0 8px 20px #888;
        }

        .equation {
            font-size: 32px;
        }

        input {
            padding: 12px;
            width: 130px;
            font-size: 18px;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }

        #message,
        #message2 {
            margin-top: 20px;
            min-height: 25px;
        }

        .hidden {
            display: none;
        }

        /* HORROR MODE */

        body.horror {
            background: #050505;
            color: #aaa;
        }

        body.horror .classroom {
            background: #050505;
        }

        body.horror .blackboard {
            background: #090909;
            border-color: #222;
            box-shadow: none;
        }

        body.horror .stag {
            filter: grayscale(1);
            transform: scale(1.3);
        }

        body.horror h1 {
            color: #555;
            letter-spacing: 12px;
        }

        .glitch {
            animation: glitch 0.15s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            25% { transform: translate(4px, -2px); }
            50% { transform: translate(-3px, 3px); }
            75% { transform: translate(2px, 1px); }
            100% { transform: translate(0); }
        }

        #horrorText {
            font-family: monospace;
            font-size: 20px;
            line-height: 2;
            margin: 40px auto;
            max-width: 650px;
        }

        .red {
            color: #8b0000;
        }
    </style>
</head>

<body>

<div class="classroom">

    <h1 id="title">THE STAG ESCAPE</h1>

    <p id="subtitle">ROOM 1 — THE CLASSROOM</p>

    <div class="stag" id="stag">🦌</div>

    <p id="intro">
        The bell has rung.
    </p>

    <p id="intro2">
        Somehow, a stag has been trapped inside the math classroom.
    </p>

    <div class="blackboard">

        <h2 id="boardTitle">THE BLACKBOARD</h2>

        <p id="question">
            Solve the equation to unlock the cabinet.
        </p>

        <p class="equation">
            12 + 7 × 3 − 5
        </p>

        <input id="answer1" type="number">

        <button onclick="checkFirst()">
            Submit
        </button>

        <div id="message"></div>

    </div>

    <div id="secondPuzzle" class="blackboard hidden">

        <h2>THE SECOND LOCK</h2>

        <p>
            How many numbers are in the equation?
        </p>

        <p class="equation">
            12 + 7 × 3 − 5
        </p>

        <input id="answer2" type="number">

        <button onclick="checkSecond()">
            Submit
        </button>

        <div id="message2"></div>

    </div>

    <div id="horror" class="hidden">

        <h2 class="red glitch">WAIT.</h2>

        <div id="horrorText"></div>

        <button onclick="continueHorror()">
            Continue
        </button>

    </div>

</div>


<script>

function checkFirst() {

    let answer = document.getElementById("answer1").value;

    if (answer == 28) {

        document.getElementById("message").innerHTML =
            "🔓 Correct! The cabinet opens.";

        document.getElementById("secondPuzzle")
            .classList.remove("hidden");

    } else {

        document.getElementById("message").innerHTML =
            "❌ Wrong! Try again.";

    }
}


function checkSecond() {

    let answer = document.getElementById("answer2").value;

    if (answer == 4) {

        startHorror();

    } else {

        document.getElementById("message2").innerHTML =
            "❌ Wrong. The lock refuses to open.";

    }
}


function startHorror() {

    document.body.classList.add("horror");

    document.getElementById("secondPuzzle")
        .classList.add("hidden");

    document.getElementById("title").innerText =
        "THE STAG ESCAPE";

    document.getElementById("subtitle").innerText =
        "ROOM 1";

    document.getElementById("intro").innerText =
        "";

    document.getElementById("intro2").innerText =
        "";

    document.getElementById("boardTitle").innerText =
        "";

    document.getElementById("question").innerText =
        "";

    document.querySelector(".equation").innerText =
        "";

    document.getElementById("stag").innerText =
        "🦌";

    document.getElementById("horror")
        .classList.remove("hidden");

    document.getElementById("horrorText").innerHTML =
        "The door should have opened.<br><br>" +
        "It didn't.<br><br>" +
        "The stag is no longer looking at the door.<br><br>" +
        "It's looking at <b>you.</b>";

}


function continueHorror() {

    document.getElementById("horrorText").innerHTML =
        "You solved the puzzles exactly as instructed.<br><br>" +
        "So why are you still here?<br><br>" +
        "<span class='red'>THE STAG WAS NEVER TRAPPED.</span><br><br>" +
        "The classroom was.<br><br>" +
        "And you just unlocked it.";

    document.querySelector("#horror button").innerText =
        "I WANT TO LEAVE";

    document.querySelector("#horror button").onclick =
        finalMessage;

}


function finalMessage() {

    document.getElementById("horrorText").innerHTML =
        "<span class='red'>YOU OPENED THE DOOR.</span><br><br>" +
        "But you were never supposed to.";

    document.querySelector("#horror button")
        .style.display = "none";

    document.getElementById("stag").classList.add("glitch");

}

</script>

</body>
</html>
